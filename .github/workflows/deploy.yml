# Publishing, keyed by branch.
#
#   main     -> production
#   staging  -> staging, which is protected, not indexed, and shows the
#               announcements the Comité is still preparing
#
# Both routes go through `check` first. That job is ci.yml — the same steps as
# `npm run check`, not a copy of them — and every publish job `needs` it, so a
# commit that fails the checks cannot reach the published site. That is the fix
# for issue #33: until now these were two workflows racing each other, and the
# red cross appeared next to a change that was already live.
#
# This replaces the GitHub Pages workflow. Pages does not serve a private
# repository on a free plan, and the repository was made private on 2026-08-20
# because the brief is confidential. There is nothing to re-enable.
#
# Manual dispatch publishes a chosen branch or tag to a chosen environment,
# which is also how a bad release is rolled back by republishing an earlier
# commit. The faster rollback — swapping the previous release back on the
# server — is in docs/deploy-pipeline.md.
name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to publish the branch or tag selected above
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

concurrency:
  # Never cancelled: a run interrupted between the transfer and the swap leaves
  # a directory to clean up. Two pushes in quick succession queue instead.
  # ci.yml turns its own cancellation off when it is called, so the whole chain
  # queues rather than cancelling half of itself.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Checks
    uses: ./.github/workflows/ci.yml

  # Not configured yet is a known state, not a failure. Until a human opens the
  # accounts and adds the secrets (docs/infrastructure-setup.md), publishing is
  # skipped and this job says so in the run summary.
  #
  # Gated on the site URL *variable* rather than a secret because the `secrets`
  # context is not available in a job-level `if`. A configured deployment always
  # has one; a half-configured one still reaches preflight, which names exactly
  # what is missing. So: absent configuration skips quietly and visibly,
  # incomplete configuration fails loudly. A permanently red main teaches people
  # to stop reading it, which is how the guard that stops an invented event
  # reaching production gets ignored.
  not-configured:
    name: Deployment not configured
    if: "${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main' && vars.PROD_SITE_URL == '') || (github.ref == 'refs/heads/staging' && vars.STAGING_SITE_URL == '')) }}"
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Say so in the summary
        run: |
          {
            echo "### Checks passed. Nothing was published."
            echo
            echo "No hosting is configured for \`${{ github.ref_name }}\` yet, so the deploy step was skipped."
            echo "The site builds and every check is green — it simply has nowhere to go."
            echo
            echo "See \`docs/infrastructure-setup.md\` for the ordered list of what a human must do first."
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Production
    if: "${{ vars.PROD_SITE_URL != '' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) }}"
    needs: check
    uses: ./.github/workflows/publish.yml
    with:
      environment: production
      indexable: true
      show_drafts: false
      site_url: ${{ vars.PROD_SITE_URL }}
    secrets:
      ssh_host: ${{ secrets.PROD_SSH_HOST }}
      ssh_port: ${{ secrets.PROD_SSH_PORT }}
      ssh_user: ${{ secrets.PROD_SSH_USER }}
      ssh_key: ${{ secrets.PROD_SSH_KEY }}
      ssh_known_hosts: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      deploy_path: ${{ secrets.PROD_DEPLOY_PATH }}

  staging:
    name: Staging
    if: "${{ vars.STAGING_SITE_URL != '' && ((github.event_name == 'push' && github.ref == 'refs/heads/staging') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) }}"
    needs: check
    uses: ./.github/workflows/publish.yml
    with:
      environment: staging
      indexable: false
      show_drafts: true
      site_url: ${{ vars.STAGING_SITE_URL }}
    secrets:
      ssh_host: ${{ secrets.STAGING_SSH_HOST }}
      ssh_port: ${{ secrets.STAGING_SSH_PORT }}
      ssh_user: ${{ secrets.STAGING_SSH_USER }}
      ssh_key: ${{ secrets.STAGING_SSH_KEY }}
      ssh_known_hosts: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      deploy_path: ${{ secrets.STAGING_DEPLOY_PATH }}
      basic_auth: ${{ secrets.STAGING_BASIC_AUTH }}
