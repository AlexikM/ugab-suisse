# Mirrors `npm run check`, step for step and in the same order, so that anything
# failing here can be reproduced with one local command.
#
# Runs on every pull request, and — through `workflow_call` — as the first job
# of deploy.yml. That is why there is no `push` trigger for main: a push to main
# starts the deploy, the deploy calls this workflow, and nothing publishes until
# it is green. Calling it rather than copying its steps is what keeps the gate
# honest; a duplicated list of steps drifts. See issue #33.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Keyed by the calling workflow as well as the ref, so that a pull-request run
  # cannot cancel the check a deploy is waiting on.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned to match publish.yml. Astro 6 requires Node >= 22.12.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type and content validation
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Build
        run: npm run build

      # Two runners by design: Vitest for the build-output assertions, and
      # node:test for the content and compliance suites, whose `todo` tests must
      # run and be allowed to fail (Vitest's todo skips instead). `npm run test`
      # chains both — see issue #38.
      - name: Assertions against the built output
        run: npm run test

      # Only the browser the suite actually uses; see playwright.config.ts.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        id: browser-tests
        run: npm run test:e2e

      - name: Keep the report when a browser test fails
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
