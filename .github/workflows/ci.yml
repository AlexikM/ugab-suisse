# Runs on every pull request. Mirrors `npm run check`, step for step and in the
# same order, so that anything failing here can be reproduced with one local
# command. Deployment lives in deploy.yml and is not touched by this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to match deploy.yml. Astro 6 requires Node >= 22.12.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type and content validation
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Assertions against the built output
        run: npm run test

      # Only the browser the suite actually uses; see playwright.config.ts.
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the report when a browser test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
