<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="UGAB">
  <!--
    The network's mark: the U of UGAB, as agbu.org and ugabfrance.org carry it.

    Drawn rather than copied, so it stays sharp at any size and weighs nothing.
    The geometry was measured off the 256px original and fitted — 97.6% of the
    pixels agree — and the blue is #243C98, which is the blue of this site's own
    header logo rather than the 4-unit-different one the raster happens to hold.
    A visitor sees both at once; they should be the same colour.

    Deliberately one flat colour with no dark-mode rule. The file this replaced
    was Astro's own logo, still there from the starter template, and it inverted
    itself in dark mode — reasonable for a framework's mark, wrong for an
    organisation's, which is one colour wherever it appears.
  -->
  <path
    d="M69.5 18V167.5a58.5 58.5 0 0 0 117 0V18"
    fill="none"
    stroke="#243C98"
    stroke-width="21.5"
  />
</svg>
